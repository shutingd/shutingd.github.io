  <title>Shuting Ding - Gallery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 850px;
      margin: 0 auto;
      padding: 20px;
      line-height: 1.6;
      background-color: #fdfdfd;
    }
    h1, h2 {
      color: #2c3e50;
    }
    a {
      color: #2980b9;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    nav ul {
      list-style-type: none;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #333;
    }
    nav li {
      float: left;
    }
    nav li a {
      display: block;
      color: white;
      text-align: center;
      padding: 14px 16px;
      text-decoration: none;
    }
    nav li a:hover {
      background-color: #111;
    }
    nav li a.active {
      background-color: #111;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .gallery figure {
      margin: 0;
    }
    .gallery img {
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 8px;
      object-fit: cover;
      background-color: #eee;
    }
    .gallery figcaption {
      margin-top: 6px;
      color: #555;
      font-size: 0.92em;
    }
  </style>
